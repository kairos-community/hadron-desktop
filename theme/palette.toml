# The Isotope palette: one source for the colours of every desktop variant.
#
# Edit a value here, then run `python3 tools/gen-theme.py` to rewrite the
# configs that use it. CI runs `python3 tools/gen-theme.py --check`, which
# fails when a config drifts from this file or a contrast floor is broken.
#
# The colours follow the Kairos design system (github.com/kairos-io/design)
# for roles and contrast, with Isotope's own neutrals: a warm graphite, leaning
# slightly toward the lime, so the desktop does not read as a blue-violet
# terminal theme. Isotope lime is the accent; Kairos orange stays as the family
# tie. Night is what the
# splash, GRUB, ly, sway and i3 use. Day is for Noctalia's light mode (and
# later COSMIC and Flatpak apps); sway and i3 have no light mode yet.
#
# Roles, not hues: name a colour by what it does, so a config line says
# "inactive label" and not "grey".

[night]
crust     = "#0c0d0b"  # darkest: terminal black, text on accent
base      = "#141411"  # desktop, terminal, bars, popups
surface   = "#1d1d1a"  # capsules, cards
overlay   = "#2a2b25"  # selection, hover
border    = "#393a34"  # inactive borders, separators
muted     = "#595b52"  # decoration only (2.8:1 on base); never for text you must read
dim       = "#909287"  # inactive labels, placeholders (4.1:1 on base)
subtext   = "#ced0c8"  # secondary text
text      = "#f4f5f2"  # primary text
accent    = "#8fd12e"  # focus, selection, brand
glow      = "#c6f36b"  # secondary accent: clock, focus indicator
violet    = "#b49cf2"  # tertiary accent: binding mode, matches
success   = "#3faf6e"
warning   = "#e0af68"
error     = "#f7768e"
orange    = "#ff7442"
on_accent = "#141411"  # text on accent, error and the other bright fills

[day]
crust     = "#d8d9d3"
base      = "#f4f5f2"
surface   = "#ffffff"
overlay   = "#e9eae6"
border    = "#cbcdc6"
muted     = "#76786d"
dim       = "#61635a"
subtext   = "#4a4c43"
text      = "#1c1d19"
accent    = "#3b7504"
glow      = "#0b6e6e"
violet    = "#6d3fd0"
success   = "#2a7548"
warning   = "#875700"
error     = "#c4194f"
orange    = "#a33600"
on_accent = "#ffffff"
