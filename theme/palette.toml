# The Isotope palette: one source for the colours of every desktop variant.
#
# Edit a value here, then run `python3 tools/gen-theme.py` to rewrite the
# configs that use it. CI runs `python3 tools/gen-theme.py --check`, which
# fails when a config drifts from this file or a contrast floor is broken.
#
# The colours follow the Kairos design system (github.com/kairos-io/design)
# for roles and contrast, with Isotope's own neutrals: a warm graphite.
# Brand and theme are separate: the brand roles (Autunite yellow) colour what
# names Isotope (the mark, splash, GRUB, the idle tray icon); the theme roles
# ("Carbon", a warm ivory accent) colour what you use for hours. Kairos orange
# stays as the family tie. Night is what the
# splash, GRUB, ly, sway and i3 use. Day is for Noctalia's light mode (and
# later COSMIC and Flatpak apps); sway and i3 have no light mode yet.
#
# Roles, not hues: name a colour by what it does, so a config line says
# "inactive label" and not "grey".

[night]
crust      = "#0c0d0b"
base       = "#141411"
surface    = "#1d1d1a"
overlay    = "#2a2b25"
border     = "#393a34"
muted      = "#595b52"
dim        = "#909287"
subtext    = "#ced0c8"
text       = "#f4f5f2"
accent     = "#e9e7c1"  # THEME: focus, selection, buttons, links
glow       = "#f4f5f2"  # THEME: lighter tone of the accent
violet     = "#d896db"  # tertiary: binding mode, matches, "reboot" tray state
success    = "#37be95"
warning    = "#ea8a18"
error      = "#ff7172"
orange     = "#ff7442"  # Kairos orange, the family tie
on_accent  = "#141411"
blue       = "#79b8ed"  # terminal blue
cyan       = "#89dae3"  # terminal cyan
brand      = "#e4de48"  # BRAND: the mark, splash, GRUB, the idle tray icon
brand_glow = "#f9f1af"  # BRAND: pushed side and core of the mark
brand_deep = "#9f9615"  # BRAND: deep tone (shading; the mark on light grounds)

[day]
crust      = "#d8d9d3"
base       = "#f4f5f2"
surface    = "#ffffff"
overlay    = "#e9eae6"
border     = "#cbcdc6"
muted      = "#76786d"
dim        = "#61635a"
subtext    = "#4a4c43"
text       = "#1c1d19"
accent     = "#3e3e32"
glow       = "#2a2921"
violet     = "#6432a9"
success    = "#167a69"
warning    = "#832d00"
error      = "#b00e50"
orange     = "#a33600"
on_accent  = "#ffffff"
blue       = "#1666aa"
cyan       = "#0e6f81"
brand      = "#766f08"  # BRAND on light: readable tone (night-only files do not use the day brand roles)
brand_glow = "#5e5303"  # BRAND on light: deepest tone
brand_deep = "#9f9615"  # BRAND on light: piece and core of the ink-shell mark
