# Agent appliance i3 profile (agent image only; the base i3 config is untouched).
#
# This drop-in is loaded on top of the inherited XLibre/i3 config, where $mod is
# Mod4 (the Super key). It does NOT import the session environment -- that is
# start-desktop's job, and it must happen BEFORE i3 starts, not from here.
#
# Scope:
#   * the local emergency chord (Task 6),
#   * disabling screen locking / DPMS blanking for the AGENT profile only
#     (Task 6), and
#   * starting the first-run credential panel (Task 7).
# The agent-aware status bar is a straight file override of
# /usr/bin/hadron-status (rootfs-agent shadows rootfs-i3), so the base i3
# config's existing `status_command /usr/bin/hadron-status` picks it up with
# no change needed here.

# Emergency chord: Super+Shift+Escape ($mod+Shift+Escape, $mod=Mod4) pauses or
# resumes the local runtime so an operator at the console can always halt Cua.
bindsym $mod+Shift+Escape exec --no-startup-id /usr/bin/hadron-agent control toggle

# First-run credential panel (Task 7): a no-op unless
# /run/hadron-agent/first-run-token exists (only true first boot with no
# CI-provided digest ever creates it). Waits for redacted gateway status, then
# shows the MCP URL/fingerprint/token once and unlinks the token on Enter; on
# a status timeout it retains the token so this retries on the next i3 start.
exec --no-startup-id /usr/bin/hadron-agent-first-run

# Agent kiosk: never blank, never DPMS-off, never lock. An unattended appliance
# display must stay lit so Cua always has a live framebuffer to drive. This is
# set ONLY in the agent profile; the normal i3 desktop config is unchanged.
exec --no-startup-id sh -c 'command -v xset >/dev/null 2>&1 && xset s off -dpms s noblank'
