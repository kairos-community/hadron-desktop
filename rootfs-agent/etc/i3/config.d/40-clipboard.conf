# Agent appliance: no clipboard history (shadows the i3 image's file of the
# same name, which starts hadron-clipboard daemon and binds Super+Ctrl+V).
#
# The appliance is driven by an AI agent. A history would keep every secret
# the agent or a person copies (tokens, passwords, keys) and hand it back to
# anything that can read the screen or run hadron-clipboard, including the
# agent itself in a later task. Dockerfile.agent also removes the scripts.
