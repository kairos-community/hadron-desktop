# Agent appliance Ly profile.
#
# The base image gates Ly (10-conditions.conf) with BOTH
# ConditionKernelCommandLine=!install-mode AND ConditionPathExists=!/run/cos/live_mode,
# so Ly never grabs tty1 on the live ISO or during the installer. The agent
# appliance, by contrast, is meant to auto-login the locked `agent` account and
# bring up the XLibre/i3 session even on a LIVE agent boot -- that live session
# is where Cua attaches. So this drop-in (sorted after 10-conditions.conf)
# CLEARS both inherited conditions and re-sets ONLY the install-mode guard:
# still never fight the installer for tty1, but do allow the live agent login.
#
# The Ly autologin values themselves -- auto_login_user=agent,
# auto_login_session=i3, auto_login_service=ly-autologin -- are written into
# /etc/ly/config.ini by the agent provisioning/OEM path (system/oem/90_agent_profile.yaml),
# not here; this file only owns the systemd start conditions.
[Unit]
ConditionPathExists=
ConditionKernelCommandLine=
ConditionKernelCommandLine=!install-mode
