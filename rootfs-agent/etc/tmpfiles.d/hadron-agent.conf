# Runtime (tmpfs) socket directory tree for the Hadron agent brokers.
#
# /run is a tmpfs recreated every boot, so these directories must be declared
# here (recreated by systemd-tmpfiles-setup) and their ownership/mode fixed to
# the exact isolation contract below. The `agent`-owned entries depend on the
# `agent` account existing; 90_agent_profile.yaml creates that account and then
# re-runs `systemd-tmpfiles --create` so these lines apply cleanly on first boot
# even though the account is created after the early tmpfiles pass.
#
# The security model of the four dirs:
#   session  agent:hadron-agent-gateway  2750 - agent owns it (writes its sock),
#            the gateway (group) reads it.
#   root     root:hadron-agent-gateway   2750 - ROOT owns the dir; agent is NOT
#            the owner and NOT in the owning group's write path, so agent can
#            neither unlink the root helper's socket nor create an impostor in
#            its place. Only root writes here; the gateway (group) may connect.
#   control  hadron-agent-gateway:hadron-agent-control 2750 - gateway owns it
#            (creates the control sock), the control group may connect.
#   status   hadron-agent-gateway:agent  0750 - gateway owns it (writes status),
#            agent (group) reads it.
# (The three socket dirs are 2750 = setgid; status is 0750 -- status.json is a
# plain 0644 file, not a socket, so it needs no group inheritance.)
# The three socket dirs are SETGID (2750): a Unix socket created inside them
# inherits the dir's owning group, so the cross-user client can reach it by
# group membership. This matters because the agent-run session broker cannot
# chgrp its own socket to hadron-agent-gateway (it is not a member) -- setgid
# inheritance is the only mechanism that gives the socket the right group. Each
# socket file itself is then chmod'd 0660 by the owning service (serveUnix), so
# owner+group can connect and "other" cannot.
#
# first-run is NOT a socket dir: it holds the one-shot plaintext first-run
# token that `provision` writes (0400 agent) and hadron-agent-first-run unlinks
# after showing it. It is agent:agent 0700 so agent OWNS the parent directory
# (POSIX unlink needs write on the dir, not just the file) and so the plaintext
# token is not exposed to the gateway or any other user. It must exist before
# provision runs; tmpfiles' early pass (re-run after the agent account exists,
# see above) creates it.
#
#Type Path                        Mode UID                  GID                  Age Argument
d     /run/hadron-agent           0755 root                 root                 -
d     /run/hadron-agent/session   2750 agent                hadron-agent-gateway -
d     /run/hadron-agent/root      2750 root                 hadron-agent-gateway -
d     /run/hadron-agent/control   2750 hadron-agent-gateway hadron-agent-control -
d     /run/hadron-agent/status    0750 hadron-agent-gateway agent                -
d     /run/hadron-agent/first-run 0700 agent                agent                -
