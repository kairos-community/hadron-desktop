# Agent appliance: the X server must never blank or DPMS-off its output.
#
# An unattended appliance display has to stay lit, because Cua drives the
# desktop through XTest -- and XTest's synthetic pointer and key events do NOT
# reset the X server's screensaver/DPMS idle timer. Once the output goes to
# DPMS Off, the agent cannot wake it: every input it is capable of generating
# is exactly the kind the idle timer ignores. The framebuffer is then dark for
# the rest of the session, screen captures come back black, and the appliance
# is silently blind.
#
# 90-hadron-agent.conf states this same intent with
#   `command -v xset >/dev/null 2>&1 && xset s off -dpms s noblank`
# but the agent image ships no xset, so that guard is always false and the
# guarantee silently never applies. Expressing it as server configuration
# removes the dependency on a binary that is not there, and applies from
# server start rather than from i3 startup.
#
# Zero means "never" for all four timers.

Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
