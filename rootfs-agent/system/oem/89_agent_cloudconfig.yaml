# Publish the ISO's embedded cloud-config into /oem on a LIVE boot.
#
# `auroraboot build-iso --cloud-config <cfg>` writes <cfg> to the ISO root as
# /config.yaml, which a livecd/install boot mounts at
# /run/initramfs/live/config.yaml (that path is one of the dirs kairos-agent
# itself scans -- see kairos constants.GetUserConfigDirs).
#
# On an INSTALL that config reaches the installed system for free: kairos-agent
# install merges it into the installed /oem (as 90_custom.yaml), so
# hadron-agent-provision -- which only reads `--oem-dir /oem` -- finds the
# configured bearer digests there. On a LIVE boot nothing performs that merge,
# so provision saw no digests at all and minted a throwaway first-run token
# instead, silently ignoring the auth the operator baked into the ISO. A live
# appliance was therefore unreachable with its own configured credentials.
#
# Copy it into /oem here. This runs in the `boot` stage, and
# hadron-agent-provision.service is ordered After=cos-setup-boot.service, so the
# file is in place before provision reads it. The 99_ prefix sorts last in
# /oem's merge, so a config explicitly provisioned onto the machine still wins
# over the ISO's embedded one. The copy is skipped once it exists (idempotent
# across cos-setup re-runs) and is a no-op on an installed system, where
# /run/initramfs/live does not exist.
#
# Guarded on !install-mode (the installer path already merges it) and on the
# agent profile marker, so this is a hard no-op on any non-agent image.
name: "Hadron agent embedded cloud-config"
stages:
  boot:
    - if: '! grep -q "install-mode" /proc/cmdline && [ -f /etc/hadron-agent/profile ] && [ -f /run/initramfs/live/config.yaml ] && [ ! -f /oem/99_hadron_embedded_config.yaml ]'
      name: "publish the ISO's embedded cloud-config into /oem"
      commands:
        - mkdir -p /oem
        # Written 0600: it carries the appliance's bearer digests, and /oem is
        # readable by more than root on some layouts.
        - install -m 0600 /run/initramfs/live/config.yaml /oem/99_hadron_embedded_config.yaml
