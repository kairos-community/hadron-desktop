<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Hadron Desktop</title>
  <desc id="d">An immutable Linux desktop built from source on Hadron, in four desktops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="q1" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#c0caf5"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </radialGradient>
    <radialGradient id="q2" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e0f6ff"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </radialGradient>
    <radialGradient id="q3" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ede3ff"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#24283b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)" opacity="0.6"/>

  <!-- the hadron: three quarks inside crossing orbits -->
  <g transform="translate(250 200)">
    <circle r="170" fill="url(#halo)"/>
    <g fill="none" stroke-width="2">
      <ellipse rx="150" ry="52" stroke="#7aa2f7" opacity="0.7"/>
      <ellipse rx="150" ry="52" stroke="#7dcfff" opacity="0.6" transform="rotate(60)"/>
      <ellipse rx="150" ry="52" stroke="#bb9af7" opacity="0.6" transform="rotate(-60)"/>
    </g>
    <circle cx="150" cy="0" r="6" fill="#7aa2f7"/>
    <circle cx="-75" cy="130" r="6" fill="#7dcfff" transform="rotate(0)"/>
    <circle cx="-75" cy="-130" r="6" fill="#bb9af7"/>
    <circle cx="0" cy="-19" r="20" fill="url(#q1)"/>
    <circle cx="-17" cy="11" r="20" fill="url(#q2)"/>
    <circle cx="17" cy="11" r="20" fill="url(#q3)"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="470" y="178" font-size="76" font-weight="700" fill="#c0caf5" letter-spacing="-1">Hadron <tspan fill="#7aa2f7">Desktop</tspan></text>
    <text x="474" y="230" font-size="27" fill="#a9b1d6">An immutable Linux desktop, compiled from source.</text>
    <text x="474" y="266" font-size="27" fill="#a9b1d6">Pick how you like to work.</text>
  </g>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600">
    <rect x="474" y="300" width="112" height="36" rx="18" fill="#24283b" stroke="#7aa2f7"/>
    <text x="530" y="324" text-anchor="middle" fill="#7aa2f7">COSMIC</text>
    <rect x="598" y="300" width="88" height="36" rx="18" fill="#24283b" stroke="#bb9af7"/>
    <text x="642" y="324" text-anchor="middle" fill="#bb9af7">niri</text>
    <rect x="698" y="300" width="88" height="36" rx="18" fill="#24283b" stroke="#7dcfff"/>
    <text x="742" y="324" text-anchor="middle" fill="#7dcfff">Sway</text>
    <rect x="798" y="300" width="64" height="36" rx="18" fill="#24283b" stroke="#9ece6a"/>
    <text x="830" y="324" text-anchor="middle" fill="#9ece6a">i3</text>
  </g>
</svg>
