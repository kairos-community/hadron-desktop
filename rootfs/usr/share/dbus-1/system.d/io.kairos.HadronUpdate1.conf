<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  hadron-updated, the root update service of Hadron Desktop.

  Only root may own the name. Anyone may call it: the read-only methods are
  open, and the service asks polkit before every mutating one (Apply, Cancel,
  Reboot, RebootPrevious, InstallExtension, SetExtensionEnabled,
  RemoveExtension, and the Recovery* methods, which also read their
  secrets from a file descriptor), so this file is not the access check.
-->
<busconfig>
  <policy user="root">
    <allow own="io.kairos.HadronUpdate1"/>
    <allow send_destination="io.kairos.HadronUpdate1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.kairos.HadronUpdate1"/>
    <allow receive_sender="io.kairos.HadronUpdate1"/>
  </policy>
</busconfig>
