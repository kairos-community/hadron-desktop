# Keep immucore's logs off the console so they don't print over the hadron-splash
# animation in the initramfs. immucore.service (from kairos-init's 28immucore
# module) defaults to journal+console on both streams; this drop-in keeps the
# journal (so `journalctl` inside the initramfs still has everything) but splits
# the two streams:
#
#   stdout -> journal only. This is normal-boot mount progress, and it is exactly
#             what would otherwise print over the animation.
#   stderr -> journal+console. This is how a mount FAILURE announces itself. If
#             immucore cannot mount the root filesystem we drop to an emergency
#             shell, and routing stderr to the journal only would leave that shell
#             on screen with no reason given. The reason must reach the screen.
#
# Delete this file from the 50hadron-splash dracut module to see immucore's mount
# progress on screen again.
[Service]
StandardOutput=journal
StandardError=journal+console
