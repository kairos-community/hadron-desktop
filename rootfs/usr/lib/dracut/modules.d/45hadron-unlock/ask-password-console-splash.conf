# kairos-splash puts tty1 in graphics mode, so a password prompt written to
# the console is drawn under the animation and nobody sees it. The console
# agent only starts when something asks for a password (its .path unit watches
# /run/systemd/ask-password), so stop the splash then: Conflicts= stops it,
# After= makes the agent wait until the splash has put the console back in
# text mode.
[Unit]
Conflicts=kairos-splash.service
After=kairos-splash.service
