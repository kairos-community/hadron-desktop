# Hadron's kairos-splash in the initramfs is also the password agent (see
# hadron-ask-gate.sh).
[Unit]
# The keymap first. systemd-vconsole-setup skips every VT that is in graphics
# mode ("All allocated virtual consoles are busy"), and the splash puts tty1
# in graphics mode at once, so without this edge the keymap from
# rd.vconsole.keymap= is often never loaded and a passphrase typed on a
# German or Italian keyboard comes out as if typed on a US one.
Wants=systemd-vconsole-setup.service
After=systemd-vconsole-setup.service

[Service]
# READY=1 comes once the splash knows whether it answers questions: it has
# written /run/hadron-ask/splash-agent, or decided not to (no framebuffer).
# The console agent is ordered after this unit, so it never sees the
# decision half made.
Type=notify
NotifyAccess=main
TimeoutStartSec=15s
