# The console password agent asks on /dev/console (tty1 and the serial
# console). When the splash answers the question itself, this agent must not
# also ask, and when the splash cannot answer, the splash must leave tty1
# first. hadron-ask-gate decides which. See hadron-ask-gate.sh.
[Unit]
After=kairos-splash.service

[Service]
ExecStartPre=/usr/libexec/hadron-ask-gate
# The gate waits for as long as the splash answers questions.
TimeoutStartSec=infinity
