# Where `hadron-ext` (the update service) looks for system extensions.
# One catalog=URL per line, searched in order: the first catalog that
# publishes a name wins. A catalog is a JSON file in the Kairos format
# (kairos-io/kairos sdk/extensions/catalog.go). Without a valid line, the
# hadron-layers catalog below is used.
catalog=https://kairos-io.github.io/hadron-layers/releases.json
