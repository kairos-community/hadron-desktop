# Isotope installed-system GRUB menu fragment. kairos-init copies this to
# the COS_STATE partition as /grubmenu (08_grub.yaml "Grub branding"); the main
# /etc/cos/grub.cfg sources it from (${menu_blk}) at the end, so it can both add
# menu entries AND switch the menu to the Isotope gfxterm theme. (menu_blk is
# the device holding /grubmenu — i.e. COS_STATE.)

# The Isotope theme on gfxterm. theme.txt needs the gfxmenu and tga modules.
# GRUB loads modules from $prefix/<platform>. On BIOS that is the full module
# tree grub-install wrote, so we load them from there. On EFI it is
# (COS_STATE)/grub2, where kairos-agent puts only five modules, so the
# 09_isotope_grub_theme oem stage puts the image's EFI module tree in
# (COS_STATE)/isotope/grub2 and we point $prefix there only for the insmods. That
# copy has no command.lst: GRUB reads <prefix>/<platform>/command.lst when it
# starts and each time $prefix is set, and its `rmmod: minicmd` line turns the
# no-op rmmod function in /etc/cos/grub.cfg into a real rmmod that prints "no
# such module".
#
# The font theme.txt names, "Unifont Regular 16", is the unicode.pf2 that
# /etc/cos/grub.cfg already loads with `loadfont unicode`. theme.txt's
# desktop-image is a TGA because GRUB's png.mod rejects valid PNGs ("unsupported
# format"). Everything is guarded on the files existing, so a missing one just
# leaves the plain text menu and can never block boot.
if [ -f "${prefix}/${grub_cpu}-${grub_platform}/tga.mod" ]; then
    insmod gfxterm
    insmod gfxmenu
    insmod tga
elif [ -f "(${menu_blk})/isotope/grub2/${grub_cpu}-${grub_platform}/tga.mod" ]; then
    set saved_prefix="${prefix}"
    set prefix="(${menu_blk})/isotope/grub2"
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    insmod tga
    set prefix="${saved_prefix}"
fi
if [ -f (${menu_blk})/themes/isotope/theme.txt ]; then
    set gfxmode=auto
    terminal_output gfxterm
    set theme=(${menu_blk})/themes/isotope/theme.txt
fi

# Quiet the kernel boot further than kairos-init does. Its grub.cfg already
# puts `splash quiet` on the normal entries and deliberately leaves recovery
# verbose. The themed gfxterm menu leaves the GPU in a graphics mode, where the
# udev and kernel-warning churn that `quiet` still lets through renders as
# colourful static over the splash; loglevel=3 and udev.log_level=3 drop that.
# Errors (KERN_ERR and worse) still reach the console. The live ISO menu
# (auroraboot/live-grub.cfg.tmpl) carries the same two. extra_cmdline is
# appended to every entry, so any pre-existing value (e.g. from grubenv) is
# preserved.
#
# The vt.default_* lists set the Linux console's 16 colours to the Isotope
# palette, so the boot messages, the ly login and the console sit on the
# desktop's violet ink instead of black (ly asks for these colours by index). The
# values are generated from theme/palette.toml by tools/gen-theme.py; the
# live ISO menu (auroraboot/live-grub.cfg.tmpl) carries the same.
set isotope_vt_palette="vt.default_red=0x14,0xf7,0x3f,0xe0,0x8f,0xb4,0xc6,0xce,0x90,0xf7,0x3f,0xe0,0x8f,0xb4,0xc6,0xf4 vt.default_grn=0x14,0x76,0xaf,0xaf,0xd1,0x9c,0xf3,0xd0,0x92,0x76,0xaf,0xaf,0xd1,0x9c,0xf3,0xf5 vt.default_blu=0x11,0x8e,0x6e,0x68,0x2e,0xf2,0x6b,0xc8,0x87,0x8e,0x6e,0x68,0x2e,0xf2,0x6b,0xf2"
set extra_cmdline="${extra_cmdline} loglevel=3 udev.log_level=3 ${isotope_vt_palette}"

# Boot details: the normal boot with isotope.bootvine, which makes the splash
# hand the screen to bootvine at once: a live tree of the systemd jobs, the
# units that failed and why, and the slowest ones (splash/README.md). D on the
# splash does the same without this entry. The body is the "cos" entry of
# kairos-init's /etc/cos/grub.cfg, which sources this file after its own
# entries, so ${display_name}, $kernel and $initramfs are already set.
menuentry "${display_name} (boot details)" --id isotope-boot-details {
  search --no-floppy --label --set=root COS_STATE
  set img=/cOS/active.img
  set label=COS_ACTIVE
  if [ -d (loop0) ]; then
    loopback -d loop0
  fi
  loopback loop0 /$img
  set root=($root)
  source (loop0)/etc/cos/bootargs.cfg
  linux (loop0)$kernel $kernelcmd ${extra_cmdline} ${extra_active_cmdline} isotope.bootvine
  initrd (loop0)$initramfs
}
