# Clipboard history: Super+Ctrl+V lists the last 200 text copies in dmenu, and
# the chosen one goes back on the clipboard. hadron-clipboard daemon records
# them (clipnotify, xsel) in memory for this session only.
#
# The agent image shadows this file with an empty one: see
# rootfs-agent/etc/i3/config.d/40-clipboard.conf.
exec --no-startup-id hadron-clipboard daemon
# help-section: Basics
# help: Clipboard history: copy an earlier entry again
bindsym $mod+Ctrl+v exec --no-startup-id hadron-clipboard
