name: design trial build

# Fork-only trial. It builds the One light design on the amd64 desktop line a
# real machine runs (GPU=full, FIRMWARE=true) and publishes it to the registry
# of the repository it runs in, so `isotope upgrade --image` can try it. It runs
# on a push to the trial branch. Remove this file before the change goes
# upstream.
on:
  push:
    branches: [design/one-light]

permissions:
  contents: read

env:
  # The prebuilt LLVM (and COSMIC) images of the upstream release builds.
  PREBUILT_REPO: ghcr.io/kairos-community/isotope
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: ${{ matrix.desktop }} image (full)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # <desktop>-<base release>-<label>. Change the label for every new
        # test image: a tag is never reused.
        include:
          - desktop: sway
            tag: sway-v0.0.22-onelight-2
    env:
      DESKTOP: ${{ matrix.desktop }}
      TEST_TAG: ${{ matrix.tag }}
      GPU: full
      FIRMWARE: "true"
      # Read only: nothing is written back to the upstream cache.
      CACHE_REF: ghcr.io/kairos-community/isotope:buildcache
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Refuse to reuse a tag
        run: |
          if docker buildx imagetools inspect "${IMAGE_REPO}:${TEST_TAG}" >/dev/null 2>&1; then
            echo "tag ${TEST_TAG} exists already, change the tag" >&2
            exit 1
          fi
      - name: Find the prebuilt LLVM and COSMIC images
        shell: bash
        run: |
          set -euo pipefail
          refs=("LLVM_IMAGE=${PREBUILT_REPO}:$(make -s print-llvm-tag)")
          if [[ "$DESKTOP" == cosmic ]]; then
            for part in shell apps; do
              refs+=("COSMIC_${part^^}_IMAGE=${PREBUILT_REPO}:$(make -s STAGE="cosmic-$part" print-stage-key)")
            done
          fi
          for r in "${refs[@]}"; do
            image="${r#*=}"
            if ! docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "no prebuilt $image: building it would take hours" >&2
              exit 1
            fi
            echo "Using $image"
            echo "$r" >> "$GITHUB_ENV"
          done
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/lib/android /usr/share/dotnet
          docker system prune --all --force
          df -h /
      - name: Use the containerd image store
        run: scripts/ci-containerd-store.sh
      - name: Build
        run: make DESKTOP="$DESKTOP" GPU="$GPU" FIRMWARE="$FIRMWARE" WALLPAPER_COMMIT="$GITHUB_SHA" IMAGE="${IMAGE_REPO}:${TEST_TAG}" image
      - name: Check desktop OpenGL
        run: test/graphics/check-desktop-gl.sh "${IMAGE_REPO}:${TEST_TAG}"
      - name: Check boot units
        run: test/boot-ux/check-boot-units.sh "${IMAGE_REPO}:${TEST_TAG}"
      - name: Push
        run: docker push "${IMAGE_REPO}:${TEST_TAG}"
