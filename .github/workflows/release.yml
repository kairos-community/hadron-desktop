name: Release ISOs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build and publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned SBOM generator. The exact tag is part of the released evidence, so it
  # is never floated to a moving tag such as `latest`.
  SYFT_IMAGE: anchore/syft:v1.29.0
  # Upgradable images. hadron-update on an installed system pulls
  # $IMAGE_REPO:<flavor>-<tag> (GPU=full, the standard images for real
  # machines) or $IMAGE_REPO:<flavor>-vm-<tag> (GPU=vm, for virtual machines),
  # by the GPU line in /etc/hadron-desktop/release, and only for a
  # tag GitHub reports as the latest *published* release, so an image pushed
  # here is invisible to users until the release job below has verified and
  # published every asset.
  IMAGE_REPO: ghcr.io/${{ github.repository }}
  # Every agent VM gate resolves its appliance image through this variable
  # (`test/agent/run.sh` takes `${1:-${AGENT_IMAGE:-agent-desktop:dev}}`, and the
  # Makefile declares `AGENT_IMAGE ?= agent-desktop:dev`), so one value keeps the
  # ISO build and the gates on the exact same tag.
  AGENT_IMAGE: agent-desktop:dev
  # Registry build cache (see CACHE_REF in the Makefile). Each image reads and
  # writes $CACHE_REF-<flavor> (vm line) or $CACHE_REF-<flavor>-full, so the
  # next release only rebuilds the stages that changed. Pull requests read the same refs (agent-gates.yml).
  CACHE_REF: ghcr.io/${{ github.repository }}:buildcache
  CACHE_PUSH: "true"

jobs:
  # LLVM and clang compile for about three hours, and every variant needs
  # them: Mesa's llvmpipe links libLLVM, and COSMIC and niri also use clang.
  # Built on their own runner, they no longer share one job's 330-minute
  # budget with the rest of a variant. The image is tagged by a hash of its
  # inputs (`make print-llvm-tag`), so it is built only when LLVM, its stage or
  # the Hadron release changes, and is reused by every later release.
  llvm:
    name: Prebuild LLVM
    # One at a time across releases: two runs started together (the Hadron
    # follower's tag and a hand-pushed one) would otherwise both compile the
    # same image. The second waits, then finds the image the first pushed.
    concurrency:
      group: prebuild-llvm
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Look for a published LLVM image
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_REPO}:$(make -s print-llvm-tag)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Reusing $image"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No $image yet; building it"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reclaim runner disk space
        if: steps.ref.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          docker system prune --all --force
          df -h /

      - name: Build and push the LLVM image
        if: steps.ref.outputs.found != 'true'
        shell: bash
        env:
          LLVM_OUT: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          make llvm-image
          docker push "$LLVM_OUT"

  # COSMIC compiles for about five hours, which with its dependencies ran past
  # the 330-minute budget of one job. Its two halves (the cosmic-shell and
  # cosmic-apps stages) build here in parallel, each pushed as an image tagged
  # by a hash of everything it is built from (`make print-stage-key`), so a
  # release rebuilds a half only when its inputs changed. The cosmic build job
  # then uses them in place of compiling COSMIC. COSMIC links Mesa, which
  # differs per GPU line, so each half is built once per line: four jobs,
  # each with its own key.
  cosmic:
    name: Prebuild COSMIC ${{ matrix.part }} (${{ matrix.gpu }})
    needs: llvm
    if: ${{ !cancelled() }}
    # One run per half and line at a time, as for LLVM above. The two lines
    # have different keys, so they need not wait for each other.
    concurrency:
      group: prebuild-cosmic-${{ matrix.part }}-${{ matrix.gpu }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        part:
          - shell
          - apps
        gpu:
          - full
          - vm
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      STAGE: cosmic-${{ matrix.part }}
      GPU: ${{ matrix.gpu }}
      LLVM_IMAGE: ${{ needs.llvm.result == 'success' && needs.llvm.outputs.image || '' }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Look for a published ${{ env.STAGE }} image
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_REPO}:$(make -s DESKTOP=cosmic GPU="$GPU" print-stage-key)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Reusing $image"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No $image yet; building it"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reclaim runner disk space
        if: steps.ref.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          docker system prune --all --force
          df -h /

      - name: Build and push the ${{ env.STAGE }} image
        if: steps.ref.outputs.found != 'true'
        shell: bash
        env:
          STAGE_OUT: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          make DESKTOP=cosmic GPU="$GPU" stage-image
          docker push "$STAGE_OUT"

  # Every flavor in two lines. full (GPU=full FIRMWARE=true) is the standard
  # one: Mesa's iris and radeonsi drivers and linux-firmware for real Intel and
  # AMD machines, with llvmpipe for VMs too. vm (GPU=vm) has only the virtual
  # and software drivers and no firmware: smaller, for VMs.
  build:
    name: Build ${{ matrix.desktop }} ISO (${{ matrix.gpu }})
    needs: [llvm, cosmic]
    # A failed LLVM or COSMIC prebuild does not stop the release: the variants
    # that need it then build it themselves, as before.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
      # cosign keyless signing of the pushed upgrade image.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        desktop:
          - sway
          - i3
          - cosmic
          - niri
        gpu:
          - full
          - vm
    env:
      DESKTOP: ${{ matrix.desktop }}
      GPU: ${{ matrix.gpu }}
      FIRMWARE: ${{ matrix.gpu == 'full' && 'true' || 'false' }}
      # The name of the line in asset names and image tags: <flavor>-<tag>
      # for full, <flavor>-vm-<tag> for vm.
      LINE: ${{ matrix.desktop }}${{ matrix.gpu == 'vm' && '-vm' || '' }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      LLVM_IMAGE: ${{ needs.llvm.result == 'success' && needs.llvm.outputs.image || '' }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Release tag must start with v and contain only letters, numbers, dots, underscores, pluses, and hyphens: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      # Standard GitHub-hosted Linux runners expose 14 GB of SSD. Remove large
      # preinstalled SDKs that this Docker-only build does not use so BuildKit
      # has room for the source-build stages.
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          docker system prune --all --force
          df -h /

      - name: Use the containerd image store
        shell: bash
        run: scripts/ci-containerd-store.sh

      # Before the build: the build cache is read from and written to GHCR.
      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # BuildKit never writes a build's base image into the local image store,
      # so `docker image inspect` would find nothing and the build manifest
      # could not record the digest the ISO was actually built from. Pulling
      # here -- after the prune above, before the build -- puts the base in the
      # store, and BuildKit then resolves `FROM` against that same local copy.
      - name: Pull the Hadron base
        shell: bash
        run: |
          set -euo pipefail
          base_ref="$(make -s print-base-image)"
          [ -n "$base_ref" ] || { echo "could not read BASE_IMAGE from the Makefile" >&2; exit 1; }
          docker pull "$base_ref"

      # The halves the cosmic job pushed. One that is missing (its job failed)
      # is compiled here instead, which may not fit in this job's budget.
      - name: Use the prebuilt COSMIC halves
        if: matrix.desktop == 'cosmic'
        shell: bash
        run: |
          set -euo pipefail
          for part in shell apps; do
            image="${IMAGE_REPO}:$(make -s GPU="$GPU" STAGE="cosmic-$part" print-stage-key)"
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "Using $image"
              echo "COSMIC_${part^^}_IMAGE=$image" >> "$GITHUB_ENV"
            else
              echo "::warning::No $image; compiling cosmic-$part in this job"
            fi
          done

      - name: Build installer ISO
        shell: bash
        run: |
          set -euo pipefail
          make DESKTOP="$DESKTOP" GPU="$GPU" FIRMWARE="$FIRMWARE" VERSION="$RELEASE_TAG" iso

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          iso_dir="build/${DESKTOP}-desktop/iso"
          mapfile -t isos < <(find "$iso_dir" -maxdepth 1 -type f -name '*.iso' -print)
          if (( ${#isos[@]} != 1 )); then
            echo "Expected exactly one ISO in $iso_dir, found ${#isos[@]}" >&2
            exit 1
          fi

          mkdir -p dist
          asset="hadron-desktop-${LINE}-${RELEASE_TAG}-amd64.iso"
          cp "${isos[0]}" "dist/$asset"
          cd dist
          sha256sum "$asset" > "$asset.sha256"

      # SPDX JSON for the final OCI image the ISO was produced from. The ISO is
      # only a bootable wrapper around that image, so the image is the artifact
      # whose package inventory is meaningful.
      - name: Generate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail

          # Makefile: `IMAGE ?= $(DESKTOP)-desktop:dev`.
          image="${DESKTOP}-desktop:dev"
          asset="hadron-desktop-${LINE}-${RELEASE_TAG}-amd64.iso"

          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "$SYFT_IMAGE" "docker:$image" --output spdx-json \
            > "dist/$asset.spdx.json"

          jq -e '.spdxVersion and .packages' "dist/$asset.spdx.json" >/dev/null

      - name: Generate build manifest
        shell: bash
        run: |
          set -euo pipefail
          asset="hadron-desktop-${LINE}-${RELEASE_TAG}-amd64.iso"
          ./scripts/release-manifest.sh "$DESKTOP" "$GPU" "$RELEASE_TAG" "${DESKTOP}-desktop:dev" \
            "dist/$asset" "dist/$asset.build.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Push the ${{ matrix.desktop }} (${{ matrix.gpu }}) upgrade image
        shell: bash
        run: |
          set -euo pipefail
          target="${IMAGE_REPO}:${LINE}-${RELEASE_TAG}"
          docker tag "${DESKTOP}-desktop:dev" "$target"
          docker push "$target"
          # Sign the digest the registry holds, never the tag: a tag can move
          # after signing, a digest cannot.
          digest="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "could not resolve the pushed digest of $target" >&2; exit 1; }
          cosign sign --yes "${IMAGE_REPO}@${digest}"

      - name: Upload ${{ matrix.desktop }} (${{ matrix.gpu }}) workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.desktop }}-${{ matrix.gpu }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Trusted Boot edition, one line first: sway on the full (hardware) line,
  # because Trusted Boot is for real machines with a TPM. A prototype, off
  # until the repository variable TRUSTED_BOOT_RELEASE is "true" and the
  # signing keys below are set; see
  # docs/superpowers/specs/2026-11-07-trusted-boot-edition-design.md.
  #
  # It does not build the desktop again. It re-runs only the Dockerfile's
  # kairos stage, with TRUSTED_BOOT=true, on the image the build job pushed
  # (`make UKI_FROM=... uki-iso`), then signs one UKI with the project keys:
  #   - the ISO, uploaded as the workflow artifact uki-<line>, not release-*,
  #     so the publish job's asset counts do not change yet;
  #   - the UKI upgrade image <flavor>-uki-<tag>, which holds the signed EFI
  #     files that `kairos-agent upgrade` copies to the ESP of a Trusted Boot
  #     system. hadron-update must pull it, never <flavor>-<tag>.
  #
  # Secrets, all PEM or the binary .auth files base64-encoded, from
  # `auroraboot genkey` run once, offline:
  #   UKI_DB_KEY, UKI_DB_PEM    sign every UKI (Secure Boot db)
  #   UKI_TPM_PCR_KEY           signs the PCR policy the disk key is sealed to
  #   UKI_PK_AUTH, UKI_KEK_AUTH, UKI_DB_AUTH
  #                             public keys systemd-boot enrolls in setup mode
  # PK.key and KEK.key never come here: they only sign key updates, offline.
  build-uki:
    name: Build sway Trusted Boot ISO (full)
    needs: [build]
    if: ${{ !cancelled() && needs.build.result == 'success' && vars.TRUSTED_BOOT_RELEASE == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DESKTOP: sway
      GPU: full
      LINE: sway-uki
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # On the runner's RAM disk, readable by the runner user only, and gone
      # with the runner. Never in the workspace, which artifacts upload from.
      - name: Write the signing keys
        shell: bash
        env:
          UKI_DB_KEY: ${{ secrets.UKI_DB_KEY }}
          UKI_DB_PEM: ${{ secrets.UKI_DB_PEM }}
          UKI_TPM_PCR_KEY: ${{ secrets.UKI_TPM_PCR_KEY }}
          UKI_PK_AUTH: ${{ secrets.UKI_PK_AUTH }}
          UKI_KEK_AUTH: ${{ secrets.UKI_KEK_AUTH }}
          UKI_DB_AUTH: ${{ secrets.UKI_DB_AUTH }}
        run: |
          set -euo pipefail
          umask 077
          keys=/dev/shm/uki-keys
          mkdir -p "$keys"
          for v in UKI_DB_KEY UKI_DB_PEM UKI_TPM_PCR_KEY UKI_PK_AUTH UKI_KEK_AUTH UKI_DB_AUTH; do
            [ -n "${!v}" ] || { echo "secret $v is not set" >&2; exit 1; }
          done
          printf '%s\n' "$UKI_DB_KEY" > "$keys/db.key"
          printf '%s\n' "$UKI_DB_PEM" > "$keys/db.pem"
          printf '%s\n' "$UKI_TPM_PCR_KEY" > "$keys/tpm2-pcr-private.pem"
          base64 -d <<<"$UKI_PK_AUTH" > "$keys/PK.auth"
          base64 -d <<<"$UKI_KEK_AUTH" > "$keys/KEK.auth"
          base64 -d <<<"$UKI_DB_AUTH" > "$keys/db.auth"
          echo "KEYS_DIR=$keys" >> "$GITHUB_ENV"

      - name: Build the Trusted Boot ISO
        shell: bash
        run: |
          set -euo pipefail
          make DESKTOP="$DESKTOP" GPU="$GPU" FIRMWARE=true VERSION="$RELEASE_TAG" \
            UKI_FROM="${IMAGE_REPO}:${DESKTOP}-${RELEASE_TAG}" KEYS_DIR="$KEYS_DIR" uki-iso
          mapfile -t isos < <(find "build/${DESKTOP}-desktop/uki-iso" -maxdepth 1 -type f -name '*-uki.iso')
          (( ${#isos[@]} == 1 )) || { echo "expected one UKI ISO, found ${#isos[@]}" >&2; exit 1; }
          mkdir -p dist
          asset="hadron-desktop-${LINE}-${RELEASE_TAG}-amd64.iso"
          cp "${isos[0]}" "dist/$asset"
          (cd dist && sha256sum "$asset" > "$asset.sha256")

      # The same signed UKI as a container image for `kairos-agent upgrade`.
      # AuroraBoot writes it as a docker-archive without our labels, so it is
      # wrapped once more to carry the io.kairos.hadron-desktop.* labels that
      # hadron-update reads before it pulls.
      - name: Build the UKI upgrade image
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$out":/output \
            -v "$KEYS_DIR":/keys:ro "$(make -s print-aurora-image)" build-uki \
            --output-dir /output --output-type container --public-keys /keys \
            --tpm-pcr-private-key /keys/tpm2-pcr-private.pem --sb-key /keys/db.key --sb-cert /keys/db.pem \
            --sdboot-in-source --boot-branding "Hadron Desktop" "docker:${DESKTOP}-desktop:uki"
          loaded="$(docker load -i "$out"/*.tar | sed -n 's/^Loaded image: //p' | tail -n1)"
          [ -n "$loaded" ] || { echo "no image in the UKI upgrade archive" >&2; exit 1; }
          printf 'FROM %s\nLABEL io.kairos.hadron-desktop.flavor=%s io.kairos.hadron-desktop.version=%s io.kairos.hadron-desktop.gpu=%s io.kairos.hadron-desktop.trusted-boot=true\n' \
            "$loaded" "$DESKTOP" "$RELEASE_TAG" "$GPU" | docker build -t "${IMAGE_REPO}:${LINE}-${RELEASE_TAG}" -

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Push the UKI upgrade image
        shell: bash
        run: |
          set -euo pipefail
          target="${IMAGE_REPO}:${LINE}-${RELEASE_TAG}"
          docker push "$target"
          digest="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "could not resolve the pushed digest of $target" >&2; exit 1; }
          cosign sign --yes "${IMAGE_REPO}@${digest}"

      - name: Upload the Trusted Boot ISO
        uses: actions/upload-artifact@v7
        with:
          name: uki-${{ env.LINE }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-agent:
    name: Gate and build agent ISO
    # The agent image is built on i3, whose Mesa needs LLVM (llvmpipe). A
    # failed LLVM prebuild does not stop it: it then compiles LLVM itself.
    needs: llvm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # cosign keyless signing of the pushed upgrade image.
      id-token: write
    # GitHub-hosted jobs are capped at six hours; the agent build plus the five
    # VM gates share that budget, and every individual gate additionally carries
    # its own shell timeout inside test/agent/run.sh.
    timeout-minutes: 330
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      LLVM_IMAGE: ${{ needs.llvm.result == 'success' && needs.llvm.outputs.image || '' }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "Release tag must start with v and contain only letters, numbers, dots, underscores, pluses, and hyphens: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      # Standard GitHub-hosted Linux runners expose 14 GB of SSD. Remove large
      # preinstalled SDKs that this Docker-only build does not use so BuildKit
      # has room for the source-build stages.
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          docker system prune --all --force
          df -h /

      - name: Install agent VM dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            jq \
            novnc \
            ovmf \
            python3-pil \
            qemu-system-x86 \
            qemu-utils \
            websockify \
            xorriso
          # The harness picks KVM when /dev/kvm is readable and falls back to
          # multi-threaded TCG otherwise; make the fast path usable when the
          # runner image exposes nested virtualisation.
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Use the containerd image store
        shell: bash
        run: scripts/ci-containerd-store.sh

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Same reason as the desktop job: the manifest's base digest is read back
      # from the local image store, which only a real pull populates.
      - name: Pull the Hadron base
        shell: bash
        run: |
          set -euo pipefail
          base_ref="$(make -s print-base-image)"
          [ -n "$base_ref" ] || { echo "could not read BASE_IMAGE from the Makefile" >&2; exit 1; }
          docker pull "$base_ref"

      - name: Build agent ISO
        shell: bash
        run: |
          set -euo pipefail
          make VERSION="$RELEASE_TAG" agent-iso

      # The gates below re-wrap the freshly built appliance image with their own
      # `cidata` seeds, so the appliance is built exactly once here and every
      # gate consumes that same image. The build cache is dropped now that the
      # image and ISO exist, leaving the VM gates room for their disks.
      - name: Reclaim build cache before the gates
        shell: bash
        run: |
          set -euo pipefail
          docker builder prune --all --force
          df -h /

      # --------------------------------------------------------------------
      # Every agent gate runs before a single release byte is prepared. This
      # job intentionally uploads nothing at all until all five have passed --
      # gate diagnostics are retained by .github/workflows/agent-gates.yml,
      # which runs the same gates on pull requests, manual dispatch, and
      # nightly.
      # --------------------------------------------------------------------

      # Builds its own probe-instrumented test image (test/agent/Dockerfile.compat)
      # on top of the agent overlay, so it drives the full local image chain.
      - name: Gate - native compatibility
        shell: bash
        run: |
          set -euo pipefail
          test/agent/run.sh compatibility

      # Boots the appliance live against a blank disk and proves the eight
      # public MCP tools plus the privilege boundaries, without writing to the
      # attached disk.
      - name: Gate - MCP and privilege contract
        shell: bash
        run: |
          set -euo pipefail
          test/agent/run.sh contract "$AGENT_IMAGE"

      - name: Gate - zero-touch install
        shell: bash
        run: |
          set -euo pipefail
          test/agent/run.sh install "$AGENT_IMAGE"

      - name: Gate - recovery and emergency pause
        shell: bash
        run: |
          set -euo pipefail
          test/agent/run.sh recovery "$AGENT_IMAGE"

      # Drives the GTK reference app and the pinned Chromium Flatpak in the
      # visible XLibre session through public computer_use only.
      - name: Gate - GTK and Chromium UI
        shell: bash
        run: |
          set -euo pipefail
          test/agent/run.sh ui "$AGENT_IMAGE"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail

          iso_dir="build/agent-desktop/iso"
          mapfile -t isos < <(find "$iso_dir" -maxdepth 1 -type f -name '*.iso' -print)
          if (( ${#isos[@]} != 1 )); then
            echo "Expected exactly one ISO in $iso_dir, found ${#isos[@]}" >&2
            exit 1
          fi

          mkdir -p dist
          asset="hadron-desktop-agent-${RELEASE_TAG}-amd64.iso"
          cp "${isos[0]}" "dist/$asset"
          cd dist
          sha256sum "$asset" > "$asset.sha256"

      - name: Generate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail

          asset="hadron-desktop-agent-${RELEASE_TAG}-amd64.iso"

          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "$SYFT_IMAGE" "docker:$AGENT_IMAGE" --output spdx-json \
            > "dist/$asset.spdx.json"

          jq -e '.spdxVersion and .packages' "dist/$asset.spdx.json" >/dev/null

      # Diagnostics only, and only when a gate failed. The "upload nothing
      # until the gates pass" rule governs RELEASE ASSETS: shipping an
      # unvalidated ISO is the risk it guards against. Leaving no evidence at
      # all behind a failed release gate just makes it undebuggable, and these
      # artifacts are the redacted ones the gates already produce.
      - name: Upload gate diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: agent-gate-diagnostics
          path: test/agent/artifacts/**
          if-no-files-found: warn
          retention-days: 7

      - name: Generate build manifest
        shell: bash
        run: |
          set -euo pipefail
          asset="hadron-desktop-agent-${RELEASE_TAG}-amd64.iso"
          ./scripts/release-manifest.sh agent vm "$RELEASE_TAG" "$AGENT_IMAGE" \
            "dist/$asset" "dist/$asset.build.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      # After every gate: an appliance image that failed one must never be
      # pullable as an upgrade.
      - name: Push the agent upgrade image
        shell: bash
        run: |
          set -euo pipefail
          target="${IMAGE_REPO}:agent-${RELEASE_TAG}"
          docker tag "$AGENT_IMAGE" "$target"
          docker push "$target"
          # Sign the digest the registry holds, never the tag: a tag can move
          # after signing, a digest cannot.
          digest="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "could not resolve the pushed digest of $target" >&2; exit 1; }
          cosign sign --yes "${IMAGE_REPO}@${digest}"

      - name: Upload agent workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-agent
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - build
      - build-agent
    # Spelled out because the default would also skip this job when only the
    # LLVM prebuild failed, which the builds recover from.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-agent.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          isos=(release/*.iso)
          checksums=(release/*.sha256)
          sboms=(release/*.spdx.json)
          manifests=(release/*.build.json)

          # Four flavors in two lines each, and the agent.
          if (( ${#isos[@]} != 9 \
             || ${#checksums[@]} != 9 \
             || ${#sboms[@]} != 9 \
             || ${#manifests[@]} != 9 )); then
            echo "Expected nine ISOs, nine checksums, nine SBOMs, and nine build manifests" >&2
            echo "Found ${#isos[@]} ISOs, ${#checksums[@]} checksums, ${#sboms[@]} SBOMs, ${#manifests[@]} manifests" >&2
            find release -maxdepth 1 -type f -print >&2
            exit 1
          fi

          cd release
          sha256sum --check ./*.sha256

          # Each SBOM must be parseable SPDX JSON with a package inventory.
          for sbom in ./*.spdx.json; do
            jq -e '.spdxVersion and (.packages | length > 0)' "$sbom" >/dev/null \
              || { echo "$sbom is not a usable SPDX document" >&2; exit 1; }
          done

          # Every manifest carries the same key set; the flavor decides which of
          # the optional values are allowed to be null.
          for manifest in ./*.build.json; do
            jq -e '
              . as $m
              | ["release_tag","git_commit","hadron_base_reference","hadron_base_digest",
                 "image_id","iso","iso_sha256","desktop_flavor","gpu","firmware","xlibre_version",
                 "cua_revision","atspi_version"]
                | all(. as $k | $m | has($k))
            ' "$manifest" >/dev/null \
              || { echo "$manifest is missing required keys" >&2; exit 1; }

            jq -e '
              (.release_tag | type == "string" and length > 0)
              and (.git_commit | test("^[0-9a-f]{40}$"))
              and (.hadron_base_reference | type == "string" and length > 0)
              and (.hadron_base_digest | test("^sha256:[0-9a-f]{64}$"))
              and (.image_id | test("^sha256:[0-9a-f]{64}$"))
              and (.iso_sha256 | test("^[0-9a-f]{64}$"))
              and (.desktop_flavor as $flavor | ["sway","i3","cosmic","niri","agent"] | index($flavor) != null)
              and (.gpu == "full" or .gpu == "vm")
              and (.firmware == (.gpu == "full"))
              and (if .desktop_flavor == "agent" then .gpu == "vm" else true end)
              and (.iso == "hadron-desktop-\(.desktop_flavor)\(if .gpu == "vm" and .desktop_flavor != "agent" then "-vm" else "" end)-\(.release_tag)-amd64.iso")
              and (if .desktop_flavor == "i3" or .desktop_flavor == "agent"
                   then (.xlibre_version | type == "string" and length > 0)
                   else .xlibre_version == null end)
              and (if .desktop_flavor == "agent"
                   then (.cua_revision | test("^[0-9a-f]{40}$"))
                        and (.atspi_version | type == "string" and length > 0)
                   else .cua_revision == null and .atspi_version == null end)
            ' "$manifest" >/dev/null \
              || { echo "$manifest has an invalid or empty required value" >&2; exit 1; }

            # The manifest must describe the ISO it was published next to.
            iso="$(jq -r '.iso' "$manifest")"
            declared="$(jq -r '.iso_sha256' "$manifest")"
            actual="$(sha256sum "$iso" | cut -d' ' -f1)"
            if [[ "$declared" != "$actual" ]]; then
              echo "$manifest records $declared for $iso but the file hashes to $actual" >&2
              exit 1
            fi
          done

          # Exactly one manifest per flavor and line, so a duplicated build
          # cannot pass the count check while one is missing.
          lines="$(jq -r '"\(.desktop_flavor)/\(.gpu)"' ./*.build.json | sort | tr '\n' ' ')"
          if [[ "$lines" != "agent/vm cosmic/full cosmic/vm i3/full i3/vm niri/full niri/vm sway/full sway/vm " ]]; then
            echo "Expected one manifest each for sway, i3, cosmic and niri in the full and vm lines, and agent; got: $lines" >&2
            exit 1
          fi

      # hadron-update on an installed system pulls without credentials. GHCR
      # creates a new package as private, and only the package settings can
      # make it public, so a release whose images need a login would publish
      # an upgrade nobody can install.
      - name: Upgrade images are public
        shell: bash
        run: |
          set -euo pipefail
          name="${IMAGE_REPO#ghcr.io/}"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${name}:pull" | jq -r '.token // empty')" || true
          if [[ -z "$token" ]]; then
            echo "${IMAGE_REPO} needs a login to pull. Make the package public:" >&2
            echo "https://github.com/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${name#*/}/settings" >&2
            exit 1
          fi
          for line in sway i3 cosmic niri sway-vm i3-vm cosmic-vm niri-vm agent; do
            ref="${IMAGE_REPO}:${line}-${RELEASE_TAG}"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --head \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${name}/manifests/${line}-${RELEASE_TAG}")"
            [[ "$code" == 200 ]] || { echo "$ref is not pullable without a login (HTTP $code)" >&2; exit 1; }
            echo "$ref: public"
          done

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release/*.iso
            release/*.sha256
            release/*.spdx.json
            release/*.build.json
          )

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
