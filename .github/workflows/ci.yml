name: CI

# Fast checks that need no image build: the Go tools' unit tests, the Hadron
# pin consistency check, the palette drift check, and syntax checks on the
# session scripts and configs.
# The image itself is built by release.yml and, for the agent, agent-gates.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: update/go.mod
          cache: false

      - name: hadron-update tests
        working-directory: update
        run: go vet ./... && go test ./...

      - name: install-ui tests
        working-directory: install-ui
        run: go vet ./... && go test ./...

      - name: Hadron pins agree
        run: scripts/bump-hadron.sh --check

      - name: Version pins are tracked by Renovate
        run: scripts/check-renovate-pins.sh

      - name: Configs match the Hadron palette
        run: python3 tools/gen-theme.py --check

      # The splash's password agent: ask-file parsing, the panel title, the
      # retry rule, and the reply on a real socket.
      - name: Boot splash password agent
        run: make -C splash test

      # The image build draws the wallpapers; a non-deterministic generator
      # would make every build ship different bytes. The committed GRUB
      # background must still be what the palette draws.
      - name: Wallpapers are deterministic, GRUB background matches the palette
        run: |
          set -euo pipefail
          for d in a b; do
            python3 tools/gen-wallpaper.py "$RUNNER_TEMP/$d" hadron-orbits-night-480x270 hadron-plain-day-480x270
          done
          cmp "$RUNNER_TEMP/a/hadron-orbits-night-480x270.png" "$RUNNER_TEMP/b/hadron-orbits-night-480x270.png"
          cmp "$RUNNER_TEMP/a/hadron-plain-day-480x270.png" "$RUNNER_TEMP/b/hadron-plain-day-480x270.png"
          python3 tools/gen-grub-bg.py "$RUNNER_TEMP/background.tga"
          cmp "$RUNNER_TEMP/background.tga" rootfs/etc/kairos/branding/hadron-theme/background.tga

      - name: Prebuilt stage keys
        run: |
          python3 tools/test_stage_key.py
          for gpu in full vm; do
            make -s GPU="$gpu" STAGE=cosmic-shell print-stage-key
            make -s GPU="$gpu" STAGE=cosmic-apps print-stage-key
          done

      - name: Shortcut sheets match the configs
        run: |
          python3 tools/test_gen_shortcuts.py
          python3 tools/gen-shortcuts.py --check

      - name: Notification keys and the welcome click
        run: test/notify/check-notify-keys.sh
      # The emoji picker with a fake picker, clipboard and notifier, the
      # list generator on a fixture, and the Super+; binding per variant.
      - name: Emoji picker
        run: test/emoji/check-emoji.sh

      # The firmware installers on a fake linux-firmware and sof-bin tree:
      # top-level links, --newest, --require, SOF links.
      - name: Firmware install scripts
        run: test/firmware/check-install-firmware.sh

      - name: Session scripts and configs parse
        shell: bash
        run: |
          set -euo pipefail
          for f in rootfs*/usr/bin/* scripts/*.sh test/boot-ux/*.sh test/notify/*.sh; do
            if head -n1 "$f" | grep -q bash; then bash -n "$f"; else sh -n "$f"; fi
          done
          jq empty rootfs-sway/etc/xdg/waybar/config
          jq empty rootfs-niri/usr/share/hadron-desktop/noctalia-palettes/Hadron.json

      # The selection and stamp logic, against a fake flatpak in Alpine.
      - name: First-run app picker
        run: test/first-run/check-first-run-apps.sh

      # Docker runs it in a throwaway Alpine container, with fake tools.
      - name: hadron-night-light state and toggle
        run: test/night-light/check-night-light.sh
      - name: Clipboard history dispatch and wiring
        run: test/clipboard/dispatch_test.sh
      - name: Extensions menu entry and wiring
        run: test/extensions/check-extensions-menu.sh
